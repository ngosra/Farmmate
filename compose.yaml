# Local infrastructure for FarmMate. Passwords here are development placeholders.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: farmmate
      POSTGRES_USER: farmmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-local-dev-only}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local-dev-only-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

volumes:
  pgdata:
  minio:
